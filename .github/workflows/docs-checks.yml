name: Docs Checks

# Guenstige, abhaengigkeitsfreie Doku-Pruefung: tote interne Links und UTF-8.
#
# Seit D-076 (Governance-Tier 1) ohne Node/Ajv und ohne Kopplung an den
# schlafenden Gate-Apparat. Die Evidence-Selbsttests sind in den
# integrity-Job von quality-gate.yml gewandert, wo sie hingehoeren.

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/check_docs.py'
      - '.github/workflows/docs-checks.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/scripts/check_docs.py'
      - '.github/workflows/docs-checks.yml'
  # Handstart auf beliebigem Branch: gh workflow run "Docs Checks" --ref <branch>
  # Laeuft dann ohne Pfadfilter - wer von Hand startet, will pruefen.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Interne Doku-Links pruefen (tote Links = Fehler)
        run: python3 .github/scripts/check_docs.py
