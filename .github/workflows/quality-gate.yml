name: Quality Gate

# D-066 integrity-only foundation.
#
# This workflow validates the contracts and their negative controls on pull
# requests. It deliberately cannot authorize a gate pass. The former manual
# authorize job was removed because it circularly required its own successful
# completion and conflated the tested subject with the later evidence carrier.
# Authorization stays fail-closed until the two-phase GateAuthorization receipt
# contract from D-066 is implemented and independently reviewed.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must equal trustBundle.nodeVersion declared in the evidence.
  NODE_VERSION: '24.4.1'

jobs:
  integrity:
    name: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned evidence-validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix quality
      - name: Evidence validator self-test (D-064 negative controls)
        run: python3 quality/scripts/validate_gate_evidence.py --self-test
      - name: Evidence validator topology self-test (CLI end-to-end)
        run: python3 quality/scripts/validate_gate_evidence.py --self-test-topology
      - name: Ajv schema self-check (schema must be valid Draft 2020-12)
        working-directory: quality
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import Ajv2020 from 'ajv/dist/2020.js';
          import addFormats from 'ajv-formats';
          const ajv = new Ajv2020({allErrors: true, strict: true, validateFormats: true});
          addFormats(ajv);
          ajv.compile(JSON.parse(fs.readFileSync('schemas/GateEvidence.schema.json', 'utf8')));
          console.log('GateEvidence.schema.json is valid Draft 2020-12');
          "
      - name: Gate runner CLI smoke test
        run: python3 quality/scripts/run_gate_check.py --help
