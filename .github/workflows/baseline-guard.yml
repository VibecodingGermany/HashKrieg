name: Baseline Guard

# D-091: a golden baseline may move only in a separate PR, unless a maintainer
# explicitly records the exception with the baseline-reset-approved label.
# The metadata-only workflow runs from the protected default branch and never
# checks out or executes code from a fork PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: baseline-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline-guard:
    name: baseline-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce baseline separation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            > "$RUNNER_TEMP/changed-files.txt"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' > "$RUNNER_TEMP/labels.txt"
          python3 .github/scripts/check_baseline_guard.py --self-test
          python3 .github/scripts/check_baseline_guard.py \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --labels "$RUNNER_TEMP/labels.txt"
